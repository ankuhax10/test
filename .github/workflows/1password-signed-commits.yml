name: 1password-signed-commits
# Third-party, shipped public enforcement: 1Password/check-signed-commits-action@v1
# (Marketplace action; fails when any commit in the PR has
#  commit.verification.verified == false). Runs on the BASE branch so it
# evaluates PRs whose head branch does not contain this workflow.
on:
  pull_request_target:
    branches: [demo/gate]
permissions:
  contents: read
  pull-requests: write
jobs:
  check-signed-commits:
    name: Check signed commits in PR
    runs-on: ubuntu-latest
    steps:
      - name: Check signed commits in PR
        uses: 1Password/check-signed-commits-action@v1
